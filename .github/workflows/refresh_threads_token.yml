name: Refresh Threads Token

# Threadsの長期トークン(約60日)を毎週延長する
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh token
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, urllib.error, urllib.parse, urllib.request
          old = os.environ.get("THREADS_ACCESS_TOKEN", "")
          if not old:
              print("THREADS_ACCESS_TOKEN未設定のためスキップします。")
              sys.exit(0)
          url = "https://graph.threads.net/refresh_access_token?" + urllib.parse.urlencode(
              {"grant_type": "th_refresh_token", "access_token": old})
          try:
              with urllib.request.urlopen(url, timeout=30) as res:
                  data = json.load(res)
          except urllib.error.HTTPError as e:
              print(f"延長に失敗しました (HTTP {e.code})。発行から24時間未満か、期限切れの可能性があります。")
              sys.exit(1)
          new = data.get("access_token", "")
          print(f"::add-mask::{new}")
          print(f"トークンを延長しました（残り約{int(data.get('expires_in', 0)) // 86400}日）。")
          if new and new != old:
              with open(os.path.join(os.environ["RUNNER_TEMP"], "threads_token"), "w") as f:
                  f.write(new)
              print("新しいトークン文字列が発行されました。")
          EOF

      # 新しいトークンが出たときは、シークレットを自動で書き換える
      # （GH_SECRETS_TOKEN = Secrets書き込み権限つきのPATを登録しておくと動きます）
      - name: Save new token
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          f="$RUNNER_TEMP/threads_token"
          [ -s "$f" ] || { echo "トークン文字列は変わっていないため更新不要です。"; exit 0; }
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_SECRETS_TOKEN未登録のため自動保存できません。THREADS_ACCESS_TOKENを手動で更新してください。"
            rm -f "$f"; exit 1
          fi
          gh secret set THREADS_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$f"
          rm -f "$f"
          echo "THREADS_ACCESS_TOKENを新しいトークンに更新しました。"
